name: Sync Stock from Sage

on:
  schedule:
    # Off-peak evening slots after 6 PM Irish time (18:17 & 19:43 UTC = 6:17/7:43 PM GMT, 7:17/8:43 PM IST)
    # Two slots provide automatic redundancy if GitHub Actions drops a scheduled run under load.
    - cron: "17 18 * * *"
    - cron: "43 19 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild index.html even if stock & prices haven't changed"
        required: false
        default: false
        type: boolean

# Prevent two runs from refreshing the same Sage refresh token concurrently.
concurrency:
  group: sage-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync stock items from Sage Accounting Ireland
        env:
          SAGE_CLIENT_ID: ${{ secrets.SAGE_CLIENT_ID }}
          SAGE_CLIENT_SECRET: ${{ secrets.SAGE_CLIENT_SECRET }}
          SAGE_REFRESH_TOKEN: ${{ secrets.SAGE_REFRESH_TOKEN }}
          SAGE_BUSINESS_ID: ${{ secrets.SAGE_BUSINESS_ID }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          CATALOG_TITLE: ${{ vars.CATALOG_TITLE }}
          CATALOG_VIEW_CODE: ${{ vars.CATALOG_VIEW_CODE }}
          CATALOG_PRICE_CODE: ${{ vars.CATALOG_PRICE_CODE }}
          CATALOG_STOCK_CODE: ${{ vars.CATALOG_STOCK_CODE }}
          CATALOG_ORDER_CODE: ${{ vars.CATALOG_ORDER_CODE }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            ARGS="--force"
          fi
          python3 scripts/sync_sage.py $ARGS

      - name: Commit and publish updated catalogue
        run: |
          if [ -z "$(git status --porcelain -- index.html .data-fingerprint)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .data-fingerprint
          git commit -m "Update stock catalogue from Sage ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
